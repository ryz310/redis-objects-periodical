version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "08:00"
    timezone: Asia/Tokyo
  cooldown:
    default-days: 7
    semver-major-days: 14
    semver-minor-days: 7
    semver-patch-days: 3
  open-pull-requests-limit: 10
  reviewers:
  - ryz310
  assignees:
  - ryz310
  labels:
  - dependabot
  ignore:
  - dependency-name: simplecov
    versions:
    - ">= 0.19.a, < 0.20"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "08:00"
    timezone: Asia/Tokyo
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  reviewers:
  - ryz310
  assignees:
  - ryz310
  labels:
  - dependabot
