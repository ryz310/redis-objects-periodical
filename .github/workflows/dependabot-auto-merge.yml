name: Dependabot Auto Merge

on:
  # Metadata only: never check out or execute the PR head in this privileged job.
  # Required for a write token on Dependabot events; only the trusted base policy runs.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  enable:
    if: >-
      ${{ vars.GHA_DEPENDABOT_AUTOMERGE_ENABLED == 'true' &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.base.ref == 'master' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted base policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@ffa630c65fa7e0ecfa0625b5ceda64399aea1b36 # v3.0.0
        with:
          github-token: ${{ github.token }}
      - name: Evaluate update and required checks
        id: policy
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        with:
          script: |
            const { evaluate } = require('./.github/scripts/dependabot-policy.cjs');
            try {
              const safe = await evaluate({ github, context, core, metadata: {
                ecosystem: process.env.ECOSYSTEM,
                updateType: process.env.UPDATE_TYPE,
                dependencyNames: process.env.DEPENDENCY_NAMES || '',
              }});
              core.setOutput('safe', safe ? 'true' : 'false');
              if (!safe) core.notice('Leaving this PR for manual review.');
            } catch (error) {
              core.setOutput('safe', 'false');
              core.warning(`Policy verification failed; leaving this PR for manual review: ${error.message}`);
            }
      - name: Reserve auto-merge for this exact head
        if: ${{ steps.policy.outputs.safe == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh pr merge --repo "$GITHUB_REPOSITORY" --auto --merge
          --match-head-commit "$PR_HEAD_SHA" "$PR_NUMBER"
