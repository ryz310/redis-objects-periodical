# Ruby CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-ruby/ for more details
#
version: 2.1

orbs:
  ruby-orbs: sue445/ruby-orbs@1.6.2
  qlty: qltysh/qlty-orb@0.1.2

references:
  - &ruby_version
    ruby_version:
      type: enum
      enum: ["2.7", "3.0", "3.1", "3.2"]
      default: "3.2"

executors:
  default:
    parameters:
      <<: *ruby_version
    docker:
      - image: cimg/ruby:<< parameters.ruby_version >>
      - image: redis:latest
        name: redis
    working_directory: ~/repo
    environment:
      SIMPLECOV_COMMAND_NAME: ruby-<< parameters.ruby_version >>

commands:
  run_rspec:
    description: "Run RSpec"
    steps:
      - run:
          name: "Execute RSpec"
          command: |
            mkdir /tmp/test-results
            TEST_FILES="$(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)"
            bundle exec rspec --format documentation \
                              --color \
                              --format RspecJunitFormatter \
                              --out /tmp/test-results/rspec.xml \
                              $TEST_FILES
      - run:
          name: Prepare coverage merge input
          command: |
            mkdir -p "tmp/simplecov-results/$SIMPLECOV_COMMAND_NAME"
            cp coverage/.resultset.json "tmp/simplecov-results/$SIMPLECOV_COMMAND_NAME/resultset.json"
      - persist_to_workspace:
          root: tmp/simplecov-results
          paths:
            - "*"
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results
      - store_artifacts:
          path: coverage
          destination: coverage
  rubocop:
    steps:
      - run:
          name: Run RuboCop
          command: bundle exec rubocop
  yardoc:
    description: "Generate YARDoc"
    steps:
      - run: bundle exec yardoc -o ./yardoc
      - store_artifacts:
          path: ./yardoc
          destination: yardoc
  rake_build:
    steps:
      - run:
          name: Rake Build
          command: bundle exec rake build
  rubocop_challenge:
    steps:
      - run:
          name: Rubocop Challenge
          command: |
            gem install rubocop_challenger
            rubocop_challenger go --email=ryz310@gmail.com --name=ryz310
  release:
    description: Release to RubyGems.org
    steps:
      - run:
          name: Create Rubygems Credentials
          command: |
            mkdir ~/.gem || true
            echo -e "---\n:rubygems_api_key: ${RUBYGEMS_API_KEY}" > ~/.gem/credentials
            chmod 0600 ~/.gem/credentials
      - run:
          name: Release Gem
          command: |
            git push --set-upstream origin ${CIRCLE_BRANCH}
            bundle exec rake release --trace
  setup:
    description: Setup for Job Working
    parameters:
      <<: *ruby_version
    steps:
      - checkout
      - ruby-orbs/bundle-install:
          cache_key_prefix: v1-dependencies-<< parameters.ruby_version >>
  test_and_build:
    description: Build the RubyGem
    steps:
      - run_rspec
      - rake_build

jobs:
  build:
    parameters:
      <<: *ruby_version
    executor:
      name: default
      ruby_version: << parameters.ruby_version >>
    steps:
      - setup:
          ruby_version: << parameters.ruby_version >>
      - test_and_build
  upload_coverage:
    executor: default
    steps:
      - setup
      - attach_workspace:
          at: tmp/simplecov-results
      - run:
          name: Collate SimpleCov coverage
          command: |
            bundle exec ruby -e '
              require "simplecov"
              require "simplecov_json_formatter"

              resultset_files = %w[2.7 3.0 3.1 3.2].map do |version|
                "tmp/simplecov-results/ruby-#{version}/resultset.json"
              end
              missing = resultset_files.reject { |file| File.file?(file) }
              abort("Missing coverage results: #{missing.join(", ")}") unless missing.empty?

              SimpleCov.collate(resultset_files, ignore_timeout: true) do
                formatter SimpleCov::Formatter::JSONFormatter
                coverage_dir "coverage"
              end
            '
      - store_artifacts:
          path: coverage
          destination: merged-coverage
      - run:
          name: Skip Qlty upload when token is missing
          command: |
            if [ -z "${QLTY_COVERAGE_TOKEN:-}" ]; then
              echo "QLTY_COVERAGE_TOKEN is not set. Coverage was merged and saved; skipping Qlty upload."
              circleci-agent step halt
            fi
      - qlty/coverage_publish:
          files: coverage/coverage.json
          skip_errors: false
  rubocop:
    parameters:
      <<: *ruby_version
    executor:
      name: default
      ruby_version: << parameters.ruby_version >>
    steps:
      - setup:
          ruby_version: << parameters.ruby_version >>
      - rubocop
  yardoc:
    executor: default
    steps:
      - setup
      - yardoc
  rubocop_challenge:
    executor: default
    steps:
      - checkout
      - rubocop_challenge
  release:
    executor: default
    steps:
      - setup
      - release

workflows:
  version: 2

  commit:
    jobs:
      - build:
          name: build_on_ruby_2.7
          ruby_version: "2.7"
      - build:
          name: build_on_ruby_3.0
          ruby_version: "3.0"
      - build:
          name: build_on_ruby_3.1
          ruby_version: "3.1"
      - build:
          name: build_on_ruby_3.2
          ruby_version: "3.2"
      - rubocop:
          ruby_version: "2.7"
      - yardoc
      - upload_coverage:
          requires:
            - build_on_ruby_2.7
            - build_on_ruby_3.0
            - build_on_ruby_3.1
            - build_on_ruby_3.2
      - release:
          context: RubyGems API Key
          requires:
            - build_on_ruby_2.7
            - build_on_ruby_3.0
            - build_on_ruby_3.1
            - build_on_ruby_3.2
            - rubocop
          filters:
            branches:
              only:
                - release

  challenge:
    triggers:
      - schedule:
          cron: "30 23 * * *" # 8:30am every day (JST)
          filters:
            branches:
              only:
                - master
    jobs:
      - rubocop_challenge

experimental:
  notify:
    branches:
      only:
        - master
        - release
